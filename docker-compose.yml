services:
  postgres:
    image: postgres:18-alpine
    container_name: greenwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenwave
      POSTGRES_PASSWORD: greenwave
      POSTGRES_DB: greenwave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenwave -d greenwave"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
