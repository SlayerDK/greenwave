services:
  postgres:
    image: postgres:18.6-alpine
    container_name: greenwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenwave
      POSTGRES_PASSWORD: greenwave
      POSTGRES_DB: greenwave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenwave -d greenwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations and exits 0, so it shows as exited.
  # Never give it restart:. Services that use the database wait for it with
  # depends_on: { migrate: { condition: service_completed_successfully } }.
  migrate:
    build: { context: ., dockerfile: database/Dockerfile }
    environment:
      DATABASE_URL: postgresql://greenwave:greenwave@postgres:5432/greenwave
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
