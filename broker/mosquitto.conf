listener 1883
protocol mqtt

listener 9001
protocol websockets

# Global authentication and ACL apply to both listeners.
allow_anonymous true
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Keep the default 1,000-message queue per client.
sys_interval 10
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
