packages:
  - shared
  - database
  - adapter
  - backend
  - predictor
  - loadgen
  - frontend

# One version for a dependency several packages share. Packages write
# "catalog:" instead of a version; `pnpm add <pkg> --save-catalog` adds one.
catalog:
  zod: ^4.6.5
  typescript: ^5
  tsx: ^4.23.15
  "@types/node": ^24
  prisma: 7.10.0
  "@prisma/client": 7.10.0
  "@prisma/adapter-pg": 7.10.0
  pg: ^8.23.0
  vitest: ^4.1.11
  # For the services and the live map (plans 03–06).
  mqtt: ^5.16.0
  pino: ^10.4.0
  pino-pretty: ^13
  croner: ^11.0.1

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
