<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img" aria-labelledby="title desc">
  <title id="title">GreenWave historical data and prediction</title>
  <desc id="desc">The live backend records averaged readings into the Postgres history tables, and the Traffic Stats export is imported into the same database once. A planned analysis and prediction job reads the history and writes forecasts for the frontend to show. The frontend's existing history page already reads the imported Traffic Stats data directly.</desc>
  <style>
    .bg { fill: #ffffff; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; }
    .muted { fill: #5f5e5a; }
    .arr { fill: none; stroke: #5f5e5a; stroke-width: 1.5; }
    .head { fill: none; stroke: #5f5e5a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .ext rect, .svc rect, .infra rect { stroke-width: 1; }
    .ext rect { fill: #f1efe8; stroke: #5f5e5a; }
    .ext .th { fill: #2c2c2a; }
    .ext .ts { fill: #5f5e5a; }
    .svc rect { fill: #eeedfe; stroke: #534ab7; }
    .svc .th { fill: #3c3489; }
    .svc .ts { fill: #534ab7; }
    .infra rect { fill: #e1f5ee; stroke: #0f6e56; }
    .infra .th { fill: #085041; }
    .infra .ts { fill: #0f6e56; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1f1e; }
      .muted { fill: #b4b2a9; }
      .arr, .head { stroke: #b4b2a9; }
      .ext rect { fill: #444441; stroke: #b4b2a9; }
      .ext .th { fill: #f1efe8; }
      .ext .ts { fill: #d3d1c7; }
      .svc rect { fill: #3c3489; stroke: #afa9ec; }
      .svc .th { fill: #eeedfe; }
      .svc .ts { fill: #cecbf6; }
      .infra rect { fill: #085041; stroke: #5dcaa5; }
      .infra .th { fill: #e1f5ee; }
      .infra .ts { fill: #9fe1cb; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="444" rx="12"/>

  <g class="svc">
    <rect x="140" y="40" width="180" height="56" rx="8"/>
    <text class="th" x="230" y="58" text-anchor="middle" dominant-baseline="central">Backend</text>
    <text class="ts" x="230" y="76" text-anchor="middle" dominant-baseline="central">averaged readings</text>
  </g>
  <g class="ext">
    <rect x="360" y="40" width="180" height="56" rx="8"/>
    <text class="th" x="450" y="58" text-anchor="middle" dominant-baseline="central">Traffic Stats export</text>
    <text class="ts" x="450" y="76" text-anchor="middle" dominant-baseline="central">a year as one weekday</text>
  </g>
  <line class="arr" x1="230" y1="98" x2="230" y2="134" marker-end="url(#arrow)"/>
  <text class="ts muted" x="220" y="116" text-anchor="end" dominant-baseline="central">recorded live</text>
  <line class="arr" x1="450" y1="98" x2="450" y2="134" marker-end="url(#arrow)"/>
  <text class="ts muted" x="460" y="116" dominant-baseline="central">one-off import</text>

  <g class="infra">
    <rect x="140" y="136" width="400" height="56" rx="8"/>
    <text class="th" x="340" y="154" text-anchor="middle" dominant-baseline="central">History tables</text>
    <text class="ts" x="340" y="172" text-anchor="middle" dominant-baseline="central">Postgres</text>
  </g>
  <line class="arr" x1="340" y1="194" x2="340" y2="230" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <g class="svc">
    <rect x="230" y="232" width="220" height="56" rx="8" stroke-dasharray="4 3"/>
    <text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central">Analysis + prediction</text>
    <text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central">planned</text>
  </g>
  <line class="arr" x1="340" y1="290" x2="340" y2="326" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <path class="arr" d="M542 164 L590 164 L590 356 L432 356" marker-end="url(#arrow)"/>
  <text class="ts muted" x="580" y="260" text-anchor="end" dominant-baseline="central">already built</text>

  <g class="svc">
    <rect x="250" y="328" width="180" height="56" rx="8"/>
    <text class="th" x="340" y="346" text-anchor="middle" dominant-baseline="central">Frontend</text>
    <text class="ts" x="340" y="364" text-anchor="middle" dominant-baseline="central">/history, forecasts</text>
  </g>

  <g class="svc"><rect x="40" y="408" width="14" height="14" rx="3"/></g>
  <text class="ts muted" x="60" y="415" dominant-baseline="central">our services</text>
  <g class="infra"><rect x="160" y="408" width="14" height="14" rx="3"/></g>
  <text class="ts muted" x="180" y="415" dominant-baseline="central">infrastructure</text>
  <g class="ext"><rect x="290" y="408" width="14" height="14" rx="3"/></g>
  <text class="ts muted" x="310" y="415" dominant-baseline="central">external source</text>
  <g class="ext"><rect x="430" y="408" width="14" height="14" rx="3" stroke-dasharray="3 2"/></g>
  <text class="ts muted" x="450" y="415" dominant-baseline="central">planned</text>
</svg>
