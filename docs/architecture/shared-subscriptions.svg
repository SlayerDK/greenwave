<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-labelledby="title desc">
  <title id="title">Normal versus shared MQTT subscriptions</title>
  <desc id="desc">Left: with a normal subscription, three backend copies each receive messages 1, 2 and 3, so every message is processed three times. Right: with a shared subscription, the broker gives message 1 to copy 1, message 2 to copy 2 and message 3 to copy 3, so each message is processed once.</desc>
  <style>
    .bg { fill: #ffffff; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; }
    .ink { fill: #2c2c2a; }
    .muted { fill: #5f5e5a; }
    .panel { fill: #f1efe8; stroke: #d3d1c7; stroke-width: 1; }
    .tok { fill: #ffffff; stroke: #888780; stroke-width: 1; }
    .arr { fill: none; stroke: #5f5e5a; stroke-width: 1.5; }
    .head { fill: none; stroke: #5f5e5a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .svc rect, .infra rect { stroke-width: 1; }
    .svc rect { fill: #eeedfe; stroke: #534ab7; }
    .svc .th { fill: #3c3489; }
    .infra rect { fill: #e1f5ee; stroke: #0f6e56; }
    .infra .th { fill: #085041; }
    .infra .ts { fill: #0f6e56; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1f1e; }
      .ink { fill: #f1efe8; }
      .muted { fill: #b4b2a9; }
      .panel { fill: #2c2c2a; stroke: #5f5e5a; }
      .tok { fill: #444441; stroke: #b4b2a9; }
      .arr, .head { stroke: #b4b2a9; }
      .svc rect { fill: #3c3489; stroke: #afa9ec; }
      .svc .th { fill: #eeedfe; }
      .infra rect { fill: #085041; stroke: #5dcaa5; }
      .infra .th { fill: #e1f5ee; }
      .infra .ts { fill: #9fe1cb; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="320" rx="12"/>

  <rect class="panel" x="40" y="40" width="280" height="260" rx="12"/>
  <text class="th ink" x="60" y="66" dominant-baseline="central">Normal subscription</text>
  <text class="ts muted" x="60" y="86" dominant-baseline="central">every copy gets every message</text>
  <g class="infra">
    <rect x="100" y="108" width="160" height="56" rx="8"/>
    <text class="th" x="180" y="126" text-anchor="middle" dominant-baseline="central">Broker</text>
    <text class="ts" x="180" y="144" text-anchor="middle" dominant-baseline="central">messages 1, 2, 3</text>
  </g>
  <line class="arr" x1="140" y1="166" x2="97" y2="202" marker-end="url(#arrow)"/>
  <line class="arr" x1="180" y1="166" x2="180" y2="202" marker-end="url(#arrow)"/>
  <line class="arr" x1="220" y1="166" x2="263" y2="202" marker-end="url(#arrow)"/>
  <g class="svc">
    <rect x="60" y="204" width="70" height="44" rx="8"/>
    <text class="th" x="95" y="226" text-anchor="middle" dominant-baseline="central">Copy 1</text>
  </g>
  <g class="svc">
    <rect x="145" y="204" width="70" height="44" rx="8"/>
    <text class="th" x="180" y="226" text-anchor="middle" dominant-baseline="central">Copy 2</text>
  </g>
  <g class="svc">
    <rect x="230" y="204" width="70" height="44" rx="8"/>
    <text class="th" x="265" y="226" text-anchor="middle" dominant-baseline="central">Copy 3</text>
  </g>
  <circle class="tok" cx="73" cy="272" r="9"/>
  <text class="ts ink" x="73" y="272" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="tok" cx="95" cy="272" r="9"/>
  <text class="ts ink" x="95" y="272" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="tok" cx="117" cy="272" r="9"/>
  <text class="ts ink" x="117" y="272" text-anchor="middle" dominant-baseline="central">3</text>
  <circle class="tok" cx="158" cy="272" r="9"/>
  <text class="ts ink" x="158" y="272" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="tok" cx="180" cy="272" r="9"/>
  <text class="ts ink" x="180" y="272" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="tok" cx="202" cy="272" r="9"/>
  <text class="ts ink" x="202" y="272" text-anchor="middle" dominant-baseline="central">3</text>
  <circle class="tok" cx="243" cy="272" r="9"/>
  <text class="ts ink" x="243" y="272" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="tok" cx="265" cy="272" r="9"/>
  <text class="ts ink" x="265" y="272" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="tok" cx="287" cy="272" r="9"/>
  <text class="ts ink" x="287" y="272" text-anchor="middle" dominant-baseline="central">3</text>

  <rect class="panel" x="360" y="40" width="280" height="260" rx="12"/>
  <text class="th ink" x="380" y="66" dominant-baseline="central">Shared subscription</text>
  <text class="ts muted" x="380" y="86" dominant-baseline="central">each message goes to one copy</text>
  <g class="infra">
    <rect x="420" y="108" width="160" height="56" rx="8"/>
    <text class="th" x="500" y="126" text-anchor="middle" dominant-baseline="central">Broker</text>
    <text class="ts" x="500" y="144" text-anchor="middle" dominant-baseline="central">messages 1, 2, 3</text>
  </g>
  <line class="arr" x1="460" y1="166" x2="417" y2="202" marker-end="url(#arrow)"/>
  <line class="arr" x1="500" y1="166" x2="500" y2="202" marker-end="url(#arrow)"/>
  <line class="arr" x1="540" y1="166" x2="583" y2="202" marker-end="url(#arrow)"/>
  <g class="svc">
    <rect x="380" y="204" width="70" height="44" rx="8"/>
    <text class="th" x="415" y="226" text-anchor="middle" dominant-baseline="central">Copy 1</text>
  </g>
  <g class="svc">
    <rect x="465" y="204" width="70" height="44" rx="8"/>
    <text class="th" x="500" y="226" text-anchor="middle" dominant-baseline="central">Copy 2</text>
  </g>
  <g class="svc">
    <rect x="550" y="204" width="70" height="44" rx="8"/>
    <text class="th" x="585" y="226" text-anchor="middle" dominant-baseline="central">Copy 3</text>
  </g>
  <circle class="tok" cx="415" cy="272" r="9"/>
  <text class="ts ink" x="415" y="272" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="tok" cx="500" cy="272" r="9"/>
  <text class="ts ink" x="500" y="272" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="tok" cx="585" cy="272" r="9"/>
  <text class="ts ink" x="585" y="272" text-anchor="middle" dominant-baseline="central">3</text>
</svg>
